<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fanframe: a picture with crop corners on the app's purple-to-blue gradient. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <clipPath id="pic"><rect x="136" y="166" width="240" height="180" rx="14"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the picture -->
  <g clip-path="url(#pic)">
    <rect x="136" y="166" width="240" height="180" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="318" cy="214" r="22" fill="#ffffff"/>
    <path d="M136 346 L210 252 L262 312 L300 270 L376 346 Z" fill="#ffffff"/>
  </g>
  <rect x="136" y="166" width="240" height="180" rx="14" fill="none" stroke="#ffffff" stroke-width="10"/>
  <!-- crop corners -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 176 V126 H146"/>
    <path d="M366 126 H416 V176"/>
    <path d="M416 336 V386 H366"/>
    <path d="M146 386 H96 V336"/>
  </g>
</svg>
