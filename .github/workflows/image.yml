# Builds the Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/fanframe:1.2.3, :1.2, :latest   a release tag v1.2.3 (latest = newest release,
#                                                    metadata-action's default latest=auto flavor)
#   ghcr.io/<owner>/fanframe:edge                    every push to main
# Pull requests only build (no push). amd64 and arm64.
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile server.py

      - name: Version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fanframe
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Fanframe
            org.opencontainers.image.description=Hand-pick, crop and save artwork for your Jellyfin shows and movies.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${{ github.repository_owner }}/fanframe:sha-${GITHUB_SHA::7}"
          image="${image,,}"
          docker run -d --name smoke -p 8765:8765 \
            -e JELLYFIN_URL=http://127.0.0.1:9 -e JELLYFIN_API_KEY=smoke-test "$image"
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/api/ping | grep -q '"version": "${{ steps.ver.outputs.version }}"' && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
